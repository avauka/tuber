[project]
name = "tuber-backend"
version = "0.1.0"
description = "TUBER Backend — Trüffel-Habitatkartierung & Felddokumentation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0.35",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    # Laufzeit-Abhängigkeit seit AP7: der Wetter-Ingest ruft Open-Meteo.
    "httpx>=0.27",
    # Single-User-Auth nach ADR 0005: Argon2id-Verify und signiertes Cookie.
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    # Gehärtetes XML-Parsing für den GPX-Upload (Backlog AP5, Pflicht).
    "defusedxml>=0.7",
    # Von FastAPI für multipart/form-data benötigt (GPX-Upload).
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-defusedxml>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Migrationen sind generierter Code (alembic revision --autogenerate) und
# werden nie von Hand nachformatiert — sonst weicht jede neue Revision ab.
extend-exclude = ["alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: benoetigt laufende PostGIS-Test-DB (docker compose up -d db)",
]
