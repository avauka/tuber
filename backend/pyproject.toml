[project]
name = "tuber-backend"
version = "0.1.0"
description = "TUBER Backend — Trüffel-Habitatkartierung & Felddokumentation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0.35",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Migrationen sind generierter Code (alembic revision --autogenerate) und
# werden nie von Hand nachformatiert — sonst weicht jede neue Revision ab.
extend-exclude = ["alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: benoetigt laufende PostGIS-Test-DB (docker compose up -d db)",
]
