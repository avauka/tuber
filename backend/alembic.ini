[alembic]
script_location = alembic
prepend_sys_path = .
# Trennzeichen für prepend_sys_path explizit. Ohne das faellt Alembic auf das
# alte Aufsplitten an Leerzeichen, Kommas und Doppelpunkten zurueck — was unter
# Windows Laufwerksbuchstaben zerlegen wuerde.
path_separator = os
# URL kommt aus ENV (DATABASE_URL), siehe alembic/env.py
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
