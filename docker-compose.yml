# Nur lokale Entwicklung. Produktion läuft auf Railway (siehe docs/decisions/0001).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: tuber
      POSTGRES_PASSWORD: tuber
      POSTGRES_DB: tuber
    ports:
      # Host-Port 5433: 5432 ist lokal von einer nativen PostgreSQL-Installation belegt.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
